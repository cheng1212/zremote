name: zremote
description: "ZCode remote chat client — Citrus Morning edition."
publish_to: 'none'
version: 0.2.10+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6
  # flutter_markdown 已停更,迁移至 flutter_markdown_plus(姊妹项目同款,T8)
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  package_info_plus: ^8.1.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
